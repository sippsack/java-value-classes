name: Publish experimental slides to GitHub Pages

on:
  push:
    branches: ['experimental/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/heads/experimental/') && !github.event.deleted
    uses: ./.github/workflows/slides-pages.yml
