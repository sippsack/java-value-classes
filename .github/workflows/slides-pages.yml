name: Publish slides to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - slides/**
  workflow_dispatch:
  workflow_call:
    inputs:
      experimental-ref:
        description: Branch to publish under experimental
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: slides/package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: bash .github/scripts/build-slides-pages.sh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          EXPERIMENTAL_REF: ${{ inputs.experimental-ref }}
          VITE_JAVA_SANDBOX_PROXY_URL: ${{ vars.JAVA_SANDBOX_PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
